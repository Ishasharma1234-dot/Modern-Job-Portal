{% extends "bsbase.html" %}
{% block title %} Manage Profile - JobPortal {% endblock %}
{% block content %}
<div class="container">
    <br>
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-white border-bottom-0 pt-4"><h4 class="text-primary">Manage Profile</h4></div>
      <div class="card-body">
        <form action="{{ url_for('manageprofile') }}" method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label>College</label>
            <input type="text" class="form-control" name="college" placeholder="Enter your College Name" value="{{ profile_data[1] if profile_data else '' }}">
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" class="form-control" name="dept" placeholder="Enter your Department Name" value="{{ profile_data[2] if profile_data else '' }}">
          </div>
          <div class="form-group">
            <label>Education Details</label>
            <textarea class="form-control" name="education" rows="3" placeholder="Describe your educational background">{{ profile_data[3] if profile_data else '' }}</textarea>
          </div>
          <div class="form-group">
            <label>Upload Resume</label>
            <input type="file" class="form-control-file" name="resume">
          </div>
          <br>
          <div class="form-group">
            <input type="submit" value="Save Profile" class="btn btn-primary btn-lg">
          </div>
        </form>
      </div>
    </div>
</div>
{% endblock %}
