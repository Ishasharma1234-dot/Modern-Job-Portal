<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    
    <!-- Custom Modern UI Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern_ui.css') }}">
    
    <link rel='icon' href='https://ddlogics.com/wp-content/uploads/2019/09/businessicondeal.png' />
    <title>{% block title%} {% endblock %}</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <a class="navbar-brand" href="{{url_for('home')}}"> JobPortal</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="{{url_for('home')}}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'profile' %}active{% endif %}" href="{{url_for('profile')}}">My Profile</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'jobs' %}active{% endif %}" href="{{url_for('jobs')}}">Jobs</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'interviews' %}active{% endif %}" href="{{ url_for('interviews') }}">Interviews</a>
            </li>
            <li class="nav-item">
              <a class="nav-link {% if request.endpoint == 'results' %}active{% endif %}" href="{{ url_for('results') }}">Results</a>
            </li>
          </ul>
        </div>
        <ul class="navbar-nav justify-content-end">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownMenuLink" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              Options
            </a>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdownMenuLink" style="background: var(--deep-bg); border: 1px solid var(--glass-border);">
              <a class="dropdown-item text-white" href="{{ url_for('account') }}">Account Details</a>
              <div class="dropdown-divider" style="border-top: 1px solid var(--glass-border);"></div>
              <a class="dropdown-item text-danger" href="{{url_for('logout')}}">Logout</a>
            </div>
          </li> 
        </ul>
      </nav>

    <div class="mt-4">
    {% block content %}
    {% endblock %}
    </div>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
  </body>
</html>
